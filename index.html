<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSRTC - Lucknow Kanpur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hero-container">
        <img src="bg-image.png" alt="UPSRTC Bus Background" class="bg-image">
    </div>

    <!-- Enhanced Music Player with Volume & Shuffle Controls -->
    <div class="music-player">
        <div class="track-info">
            <img src="bg-image.png" alt="Album Art" class="album-art">
            <div class="track-text">
                <span id="song-title" class="song-title">Loading...</span>
                <span id="artist-name" class="artist-name">Classic Playlist</span>
            </div>
        </div>

        <div class="player-controls">
            <!-- Volume Down Button -->
            <button id="vol-down-btn" class="control-btn" title="Volume Down">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
            </button>
            <!-- Volume Up Button -->
            <button id="vol-up-btn" class="control-btn" title="Volume Up">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>

            <div class="divider"></div>

            <!-- Previous Track -->
            <button id="prev-btn" class="control-btn" title="Previous Track">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <!-- Play / Pause -->
            <button id="play-pause-btn" class="control-btn main-btn" title="Play/Pause">
                <svg id="play-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
            </button>
            <!-- Next Track (Shuffle) -->
            <button id="next-btn" class="control-btn" title="Next Song">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>

    <audio id="background-audio"></audio>

    <script src="script.js"></script>
</body>
</html>
